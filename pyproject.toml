[project]
name = "fish-farm"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexsandr Bachevskiy",email = "bachevskiiaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.1,<7.0.0)"
]

[tool.poetry]
packages = [{include = "fish_farm", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]
